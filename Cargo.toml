[package]
name = "relaysms-specs"
version = "0.1.0"
edition = "2024"

[lib]
name="relaysms_spec_payload"
crate-type = ["cdylib"]

[dependencies]
rand = { version = "0.10.1", features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
uniffi = { version = "0.31.1", features = ["cli"] }
thiserror = "2.0.18"
sha2 = "0.11.0"
hkdf = "0.13.0"
hex-literal = "1.1.0"
x25519-dalek = { version="2", features=["static_secrets", "reusable_secrets"]}
aes-gcm = "0.11.0-rc.4"
aead = "0.6.0-rc.10"
chacha20poly1305 = "0.11.0-rc.3"
sha256 = "1.6.0"
digest = "0.10.7"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


[build-dependencies]
uniffi = { version = "0.31.1", features = [ "build" ] }

